<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff7ed" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>反应测速</title>
    <link rel="stylesheet" href="/shared/party.css?v=solo-offline-20260429" />
    <link rel="stylesheet" href="/shared/solo.css?v=solo-offline-20260429" />
    <link rel="stylesheet" href="/shared/game-ui.css?v=20261007-3" />
    <link rel="icon" href="/lobby/assets/lightning.svg" type="image/svg+xml" />
    <script src="/lobby/theme.js"></script>
    <script src="/shared/game-ui.js?v=20261007-3" defer></script>
  </head>
  <body class="game-page solo-page" data-game="reaction">
    <header class="play-header">
      <a class="play-brand" href="/" aria-label="派对游戏合集首页"
        ><img
          src="/lobby/assets/game-controller.svg"
          alt=""
          width="28"
          height="28"
        /><span>派对游戏合集</span></a
      ><span class="play-breadcrumb">反应测速</span>
      <div class="play-header-actions">
        <a href="/">返回大厅</a
        ><button id="play-theme" class="play-theme" aria-label="切换深色模式">
          <img src="/lobby/assets/moon.svg" alt="" width="20" height="20" />
        </button>
      </div>
    </header>
    <div class="screen active">
      <div class="container solo-card">
        <aside class="solo-sidebar">
          <span class="welcome-icon"
            ><img
              src="/lobby/assets/lightning.svg"
              alt=""
              width="40"
              height="40"
          /></span>
          <p class="game-kicker">单人小游戏</p>
          <h1 class="title">反应测速</h1>
          <p class="subtitle">等到绿色，抓住那一瞬间。</p>
          <div class="solo-stats">
            <div class="solo-stat">
              <span class="label">本次</span
              ><span id="last-time" class="value">-</span>
            </div>
            <div class="solo-stat">
              <span class="label">最佳</span
              ><span id="best-time" class="value">-</span>
            </div>
            <div class="solo-stat">
              <span class="label">次数</span
              ><span id="attempts" class="value">0</span>
            </div>
          </div>

          <div class="solo-guide">
            <h2>玩法小贴士</h2>
            <p>
              点击开始测试，等待区域变绿后立即点击。提前点击算抢跑，最佳成绩会保存在这台设备。
            </p>
            <span class="control-hint">点击 / Enter / 空格</span>
          </div>
        </aside>
        <div class="solo-stage">
          <div
            id="reaction-zone"
            class="reaction-zone"
            role="button"
            tabindex="0"
            aria-label="反应测试区域，变绿后点击或按空格"
          >
            <span id="zone-title" class="zone-title">准备开始</span>
            <span id="zone-desc" class="zone-desc">点击下方按钮开始测试</span>
          </div>

          <div class="actions">
            <button id="start-btn" class="btn btn-primary">开始测试</button>
            <a
              href="/"
              class="btn btn-secondary"
              style="text-align: center; text-decoration: none"
              >返回大厅</a
            >
          </div>
        </div>
      </div>
    </div>
    <script src="/shared/offline-cache.js?v=20261007"></script>
    <script src="game.js?v=solo-offline-20260429"></script>
  </body>
</html>
