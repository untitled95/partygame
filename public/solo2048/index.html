<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff7ed" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>2048</title>
    <link rel="stylesheet" href="/shared/party.css?v=solo-offline-20260429" />
    <link rel="stylesheet" href="/shared/solo.css?v=solo-offline-20260429" />
    <link rel="stylesheet" href="/shared/game-ui.css?v=20261007-3" />
    <link
      rel="icon"
      href="/lobby/assets/squares-four.svg"
      type="image/svg+xml"
    />
    <script src="/lobby/theme.js"></script>
    <script src="/shared/game-ui.js?v=20261007-3" defer></script>
  </head>
  <body class="game-page solo-page" data-game="solo2048">
    <header class="play-header">
      <a class="play-brand" href="/" aria-label="派对游戏合集首页"
        ><img
          src="/lobby/assets/game-controller.svg"
          alt=""
          width="28"
          height="28"
        /><span>派对游戏合集</span></a
      ><span class="play-breadcrumb">2048</span>
      <div class="play-header-actions">
        <a href="/">返回大厅</a
        ><button id="play-theme" class="play-theme" aria-label="切换深色模式">
          <img src="/lobby/assets/moon.svg" alt="" width="20" height="20" />
        </button>
      </div>
    </header>
    <div class="screen active">
      <div class="container solo-card">
        <aside class="solo-sidebar">
          <span class="welcome-icon"
            ><img
              src="/lobby/assets/squares-four.svg"
              alt=""
              width="40"
              height="40"
          /></span>
          <p class="game-kicker">单人小游戏</p>
          <h1 class="title">2048</h1>
          <p class="subtitle">让每一次合并，都离目标更近。</p>
          <div class="solo-stats">
            <div class="solo-stat">
              <span class="label">分数</span
              ><span id="score" class="value">0</span>
            </div>
            <div class="solo-stat">
              <span class="label">最佳</span
              ><span id="best-score" class="value">0</span>
            </div>
            <div class="solo-stat">
              <span class="label">状态</span
              ><span id="status" class="value">进行中</span>
            </div>
          </div>

          <div class="solo-guide">
            <h2>玩法小贴士</h2>
            <p>
              滑动棋盘，让相同的数字相遇。合并出
              2048，继续挑战更高分。试试把最大的数字留在角落。
            </p>
            <span class="control-hint">方向键 / 棋盘滑动</span>
          </div>
        </aside>
        <div class="solo-stage">
          <div id="board" class="board-2048" aria-label="2048棋盘"></div>

          <div class="actions">
            <button id="new-game-btn" class="btn btn-primary">新游戏</button>
            <a
              href="/"
              class="btn btn-secondary"
              style="text-align: center; text-decoration: none"
              >返回大厅</a
            >
          </div>
          <p class="muted">电脑用方向键，手机上下左右滑动。</p>
        </div>
      </div>
    </div>
    <script src="/shared/offline-cache.js?v=20261007"></script>
    <script src="game.js?v=solo-offline-20260429"></script>
  </body>
</html>
