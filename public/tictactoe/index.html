<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff7ed" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>井字棋</title>
    <link rel="stylesheet" href="/shared/party.css?v=solo-offline-20260429" />
    <link rel="stylesheet" href="/shared/solo.css?v=solo-offline-20260429" />
    <link rel="stylesheet" href="/shared/game-ui.css?v=20261007-3" />
    <link rel="icon" href="/lobby/assets/grid-nine.svg" type="image/svg+xml" />
    <script src="/lobby/theme.js"></script>
    <script src="/shared/game-ui.js?v=20261007-3" defer></script>
  </head>
  <body class="game-page solo-page" data-game="tictactoe">
    <header class="play-header">
      <a class="play-brand" href="/" aria-label="派对游戏合集首页"
        ><img
          src="/lobby/assets/game-controller.svg"
          alt=""
          width="28"
          height="28"
        /><span>派对游戏合集</span></a
      ><span class="play-breadcrumb">井字棋</span>
      <div class="play-header-actions">
        <a href="/">返回大厅</a
        ><button id="play-theme" class="play-theme" aria-label="切换深色模式">
          <img src="/lobby/assets/moon.svg" alt="" width="20" height="20" />
        </button>
      </div>
    </header>
    <div class="screen active">
      <div class="container solo-card">
        <aside class="solo-sidebar">
          <span class="welcome-icon"
            ><img
              src="/lobby/assets/grid-nine.svg"
              alt=""
              width="40"
              height="40"
          /></span>
          <p class="game-kicker">单人小游戏</p>
          <h1 class="title">井字棋</h1>
          <p class="subtitle">三步成线，一局见分晓。</p>
          <div class="solo-stats">
            <div class="solo-stat">
              <span class="label">你</span
              ><span id="player-score" class="value">0</span>
            </div>
            <div class="solo-stat">
              <span class="label">电脑</span
              ><span id="computer-score" class="value">0</span>
            </div>
            <div class="solo-stat">
              <span class="label">平局</span
              ><span id="draw-score" class="value">0</span>
            </div>
          </div>

          <div class="solo-guide">
            <h2>玩法小贴士</h2>
            <p>
              你执 X，电脑执
              O。横向、纵向或斜向率先连成三个就获胜。别忘了留意对手的下一步。
            </p>
            <span class="control-hint">点击空格落子</span>
          </div>
        </aside>
        <div class="solo-stage">
          <div
            id="tictactoe-board"
            class="tictactoe-board"
            aria-label="井字棋棋盘"
          ></div>

          <div class="actions">
            <button id="new-round-btn" class="btn btn-primary">新一局</button>
            <button id="reset-score-btn" class="btn btn-warning">
              清空比分
            </button>
            <a
              href="/"
              class="btn btn-secondary"
              style="text-align: center; text-decoration: none"
              >返回大厅</a
            >
          </div>
          <p id="message" class="muted">轮到你了，点击任意空格落子。</p>
        </div>
      </div>
    </div>
    <script src="/shared/offline-progress.js?v=solo-progress-20260429"></script>
    <script src="game.js?v=solo-offline-20260429"></script>
  </body>
</html>
