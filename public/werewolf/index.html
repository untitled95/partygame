<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>狼人杀</title>
    <link rel="stylesheet" href="/shared/party.css" />
    <link rel="stylesheet" href="/shared/game-ui.css?v=20261007-3" />
    <link rel="icon" href="/lobby/assets/moon-stars.svg" type="image/svg+xml" />
    <script src="/lobby/theme.js"></script>
    <script src="/shared/game-ui.js?v=20261007-3" defer></script>
  </head>
  <body class="game-page multiplayer-page" data-game="werewolf">
    <header class="play-header">
      <a class="play-brand" href="/" aria-label="派对游戏合集首页"
        ><img
          src="/lobby/assets/game-controller.svg"
          alt=""
          width="28"
          height="28"
        /><span>派对游戏合集</span></a
      ><span class="play-breadcrumb">狼人杀</span>
      <div class="play-header-actions">
        <a href="/">返回大厅</a
        ><button id="play-theme" class="play-theme" aria-label="切换深色模式">
          <img src="/lobby/assets/moon.svg" alt="" width="20" height="20" />
        </button>
      </div>
    </header>
    <div id="home-screen" class="screen active">
      <div class="container narrow">
        <div class="game-welcome">
          <span class="welcome-icon"
            ><img
              src="/lobby/assets/moon-stars.svg"
              alt=""
              width="56"
              height="56"
          /></span>
          <p class="game-kicker">多人联机 <span>4-12 人</span></p>
          <h1 class="title">狼人杀</h1>
          <p class="subtitle">天黑请闭眼，推理即将开始。</p>
          <div class="welcome-rules">
            <h2>这一局怎么玩</h2>
            <p>
              根据身份完成夜晚行动，白天发言并投票。房主负责推进阶段，请等待所有玩家完成操作。
            </p>
          </div>
        </div>
        <div class="entry-panel">
          <h2>朋友就位，准备开局</h2>
          <p class="entry-hint">取个昵称，创建房间或加入朋友的房间。</p>
          <div class="input-group">
            <label class="field-label" for="player-name">你的昵称</label
            ><input
              type="text"
              id="player-name"
              autocomplete="nickname"
              placeholder="输入你的昵称"
              maxlength="10"
            />
          </div>
          <div class="button-group">
            <button id="create-room-btn" class="btn btn-primary">
              创建房间
            </button>
            <button id="join-room-btn" class="btn btn-secondary">
              加入房间
            </button>
          </div>
          <div id="join-room-form" class="hidden">
            <div class="input-group">
              <label class="field-label" for="room-code">房间号</label
              ><input
                type="text"
                id="room-code"
                autocomplete="off"
                placeholder="输入房间号"
                maxlength="6"
              />
            </div>
            <button id="confirm-join-btn" class="btn btn-primary">
              确认加入
            </button>
          </div>
          <a href="/" class="back-link">← 返回游戏大厅</a>
        </div>
      </div>
    </div>

    <div id="lobby-screen" class="screen">
      <div class="container narrow">
        <div class="room-intro">
          <p class="game-kicker">狼人杀</p>
          <h1>等朋友，一起开局。</h1>
          <p>分享房间号，邀请朋友加入。</p>
        </div>
        <div class="room-header">
          <h2>房间号: <span id="room-id-display"></span></h2>
          <button id="copy-room-id" class="btn btn-small btn-secondary">
            复制
          </button>
        </div>

        <div class="players-section panel">
          <h3 class="section-title">
            玩家列表 (<span id="player-count">0</span>/12)
          </h3>
          <ul id="players-list"></ul>
        </div>

        <div id="host-controls" class="hidden">
          <button id="start-game-btn" class="btn btn-primary">开始游戏</button>
        </div>
        <p id="waiting-message" class="info-text">等待房主开始游戏...</p>
      </div>
    </div>

    <div id="game-screen" class="screen">
      <div class="game-shell">
        <div class="game-topbar">
          <h1 class="game-title">狼人杀</h1>
          <span>房间 <strong id="game-room-id"></strong></span>
        </div>

        <div class="match-layout">
          <section class="match-stage" aria-label="当前对局">
            <div class="role-card">
              <div class="muted">你的身份</div>
              <div id="my-role" class="big">-</div>
              <p id="role-help" class="muted">根据身份在夜晚行动，白天一起投票。</p>
            </div>

            <div class="status-banner">
              <div>阶段：<strong id="phase-text">等待中</strong></div>
              <div>第 <strong id="day-number">1</strong> 天</div>
              <div id="winner-text" class="hidden"></div>
            </div>

            <div id="game-actions" class="actions"></div>
            <div id="players-grid" class="player-grid"></div>

          </section>
          <aside class="panel match-history" aria-label="对局记录">
            <h3 class="section-title">游戏记录</h3>
            <ul id="history-list" class="history-list"></ul>
          </aside>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/shared/session.js"></script>
    <script src="game.js"></script>
  </body>
</html>
