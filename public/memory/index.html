<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff7ed" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>记忆翻牌</title>
    <link rel="stylesheet" href="/shared/party.css?v=solo-offline-20260429" />
    <link rel="stylesheet" href="/shared/solo.css?v=solo-offline-20260429" />
    <link rel="stylesheet" href="/shared/game-ui.css?v=20261007-3" />
    <link rel="icon" href="/lobby/assets/brain.svg" type="image/svg+xml" />
    <script src="/lobby/theme.js"></script>
    <script src="/shared/game-ui.js?v=20261007-3" defer></script>
  </head>
  <body class="game-page solo-page" data-game="memory">
    <header class="play-header">
      <a class="play-brand" href="/" aria-label="派对游戏合集首页"
        ><img
          src="/lobby/assets/game-controller.svg"
          alt=""
          width="28"
          height="28"
        /><span>派对游戏合集</span></a
      ><span class="play-breadcrumb">记忆翻牌</span>
      <div class="play-header-actions">
        <a href="/">返回大厅</a
        ><button id="play-theme" class="play-theme" aria-label="切换深色模式">
          <img src="/lobby/assets/moon.svg" alt="" width="20" height="20" />
        </button>
      </div>
    </header>
    <div class="screen active">
      <div class="container solo-card">
        <aside class="solo-sidebar">
          <span class="welcome-icon"
            ><img src="/lobby/assets/brain.svg" alt="" width="40" height="40"
          /></span>
          <p class="game-kicker">单人小游戏</p>
          <h1 class="title">记忆翻牌</h1>
          <p class="subtitle">翻开一张，记住一点。</p>
          <div class="solo-stats">
            <div class="solo-stat">
              <span class="label">关卡</span
              ><span id="level" class="value">1/5</span>
            </div>
            <div class="solo-stat">
              <span class="label">步数</span
              ><span id="moves" class="value">0</span>
            </div>
            <div class="solo-stat">
              <span class="label">时间</span
              ><span id="timer" class="value">0s</span>
            </div>
            <div class="solo-stat">
              <span class="label">配对</span
              ><span id="matches" class="value">0/8</span>
            </div>
          </div>

          <div class="solo-guide">
            <h2>玩法小贴士</h2>
            <p>
              每次翻开两张牌，找到相同图案。配对全部图案后进入下一关，牌数会逐渐增加。
            </p>
            <span class="control-hint">点击翻牌</span>
          </div>
        </aside>
        <div class="solo-stage">
          <div
            id="memory-board"
            class="memory-board"
            aria-label="记忆翻牌棋盘"
          ></div>

          <div class="actions">
            <button id="new-game-btn" class="btn btn-primary">重玩本关</button>
            <button id="next-level-btn" class="btn btn-success" disabled>
              下一关
            </button>
            <a
              href="/"
              class="btn btn-secondary"
              style="text-align: center; text-decoration: none"
              >返回大厅</a
            >
          </div>
          <p id="message" class="muted">
            点击两张牌，配对成功后会保留；通关后进入下一关。
          </p>
        </div>
      </div>
    </div>
    <script src="/shared/offline-progress.js?v=solo-progress-20260429"></script>
    <script src="game.js?v=solo-offline-20260429"></script>
  </body>
</html>
